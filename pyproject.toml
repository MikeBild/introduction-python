[project]
name = "introduction-python"
version = "2026.10.0"
description = "Übungen zum Workshop Python mit uv, pytest, mypy und Flask"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["flask>=3.1.3"]

[dependency-groups]
dev = ["pytest>=9.2", "mypy>=2.4.1"]
data = ["pandas>=3.1", "pandas-stubs>=3.0.5.260914", "jupyterlab>=4.6.5"]

[tool.uv]
package = false
default-groups = ["dev", "data"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.15"
